name: Build personal APK

# Builds an installable Android APK of this fork on every push to a branch
# other than main/develop (those keep upstream's own pipeline), and on demand
# from the Actions tab. The APK is attached to the "personal-latest" release,
# so it can be downloaded straight to the phone.
on:
  push:
    branches-ignore:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter + cache packages
        uses: ./.github/actions/setup-flutter-cache

      # No Sentry and no Supabase backend in a personal build: food search
      # uses Open Food Facts directly.
      - name: Generate stub .env
        uses: ./.github/actions/write-env-file
        with:
          sentry_dns: https://stub@sentry.io/0
          supabase_project_url: https://stub.supabase.co
          supabase_project_anon_key: personal-build

      - name: Install Flutter packages
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Test the nutrition label parser
        run: flutter test test/unit_test/nutrition_label_parser_test.dart

      - name: Analyze the changed code
        run: >-
          flutter analyze --no-fatal-infos
          lib/core/utils/nutrition_label_parser.dart
          lib/features/edit_meal
          test/unit_test/nutrition_label_parser_test.dart

      # Signing key from two repository secrets: PERSONAL_KEYSTORE_BASE64
      # (the keystore, base64) and PERSONAL_KEYSTORE_PASSWORD, alias
      # "personal". Without them a one-off key is made, so the APK still
      # installs, but the next build will not install over it.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PERSONAL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PERSONAL_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/personal-sideload.keystore
            echo "PERSONAL_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set. Using a one-off key: uninstall the old app before installing this one (your diary is lost unless you export it first)."
            ONE_OFF_PASSWORD="$(openssl rand -hex 16)"
            echo "::add-mask::$ONE_OFF_PASSWORD"
            keytool -genkeypair -keystore android/app/personal-sideload.keystore \
              -storepass "$ONE_OFF_PASSWORD" -keypass "$ONE_OFF_PASSWORD" \
              -alias personal -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OpenNutriTracker personal build"
            echo "PERSONAL_KEYSTORE_PASSWORD=$ONE_OFF_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: flutter build apk --flavor develop --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ont-personal-apk
          path: build/app/outputs/flutter-apk/app-develop-release.apk

      - name: Publish to the personal-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-develop-release.apk ont-personal.apk
          gh release delete personal-latest --yes --cleanup-tag || true
          gh release create personal-latest ont-personal.apk \
            --title "ONT Personal (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Open this page on your phone, tap ont-personal.apk, then install." \
            --target "${GITHUB_SHA}" \
            --prerelease
